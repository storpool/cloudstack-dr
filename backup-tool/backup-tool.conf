# copy this file to /etc/storpool/backup-tool.conf

# The StorPool cluster ID of the backup location, as defined in storpool.conf
# (SP_CLUSTER_ID=, the two-part <location>.<subcluster> form, e.g. abcd.n).
# This is matched against the "location" of each VolumeCare backup. NOTE: for
# the two parts to match, VolumeCare must run with use_cluster_id=1 (otherwise
# the backup location is reported as the bare location id, e.g. abcd).
SP_BACKUP_CLUSTER_ID = abcd.n

# The backup location NAME (the "name" column of `storpool location list`,
# NOT the location id). Passed to SnapshotFromRemote as remoteLocation.
SP_BACKUP_LOCATION_NAME = Location

# StorPool template used for temporary snapshots on the local cluster,
# before restoring the volume. This will not impact the end result.
SP_LOCAL_TEMPLATE = nvme

# disk offering for the new volumes created by the attach action
# make sure this offering is accessible by the VM owner
CS_BACKUP_DISKOFFERING_ID = 991d93f8-3cc6-4a7d-9f91-a74fbf4009a5

# ssh to a host where storpool_vcct will be executed. On the local cluster
VC_SSH_HOST = kvm1.example.net
VC_SSH_USER = root

# ---------------------------------------------------------------------------
# StorPool multicluster (optional)
# ---------------------------------------------------------------------------
# Set to 1 when CloudStack uses multiple StorPool subclusters (availability
# zones). The tool then queries storpool_vcctl status -M and detects the
# StorPool subcluster of each VM from the StorPool volume info (the clusterId
# of the VM's volumes). No sp.cluster.id lookup in CloudStack is needed, and it
# works for Stopped/freshly-provisioned VMs.
#
# Each StorPool operation is forwarded to the detected subcluster using
# StorPool's RemoteCommand, addressing the cluster by ID with the ~<clusterID>
# form (e.g. RemoteCommand/~nmjc.b/...). No registered cluster name is needed.
#
# SP_MULTICLUSTER = 1
#
# Per-subcluster overrides. The section name must match the StorPool clusterId
# (the bare cluster ID, WITHOUT the ~ prefix). Unlisted settings fall back to
# the global values above. This is useful when subclusters replicate to
# different backup locations or use different volume templates (see also
# VolumeCare use_cluster_id=1).
#
# [cluster nmjc.b]
# SP_BACKUP_CLUSTER_ID = abcd.n
# SP_BACKUP_LOCATION_NAME = Backup
# SP_LOCAL_TEMPLATE = nvme
#
# [cluster nmjc.c]
# SP_BACKUP_CLUSTER_ID = efgh.n
# SP_BACKUP_LOCATION_NAME = Backup
# SP_LOCAL_TEMPLATE = nvme2
